server.port=7000

# Database configurations (shares database with auth-service and file-managed-service)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:filesphere}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration (no schema updates, read-only/write check)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (should match the secret from auth-service)
app.jwt.secret=${JWT_SECRET:supersecretjwtkeywithatleast256bitscharacterslengthrequired1234567890!}

# Downstream services URL configurations
app.services.auth-url=${AUTH_SERVICE_URL:http://auth-service:7002}
app.services.file-url=${FILE_SERVICE_URL:http://api:7001}

# Actuator configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
