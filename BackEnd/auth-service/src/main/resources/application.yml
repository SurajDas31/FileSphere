server:
  port: 7002

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:filesphere}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:import.sql

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-placeholder-client-secret}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:facebook-placeholder-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-placeholder-client-secret}
            scope:
              - email
              - public_profile


# Application JWT secret and frontend configuration
app:
  jwt:
    secret: ${JWT_SECRET:supersecretjwtkeywithatleast256bitscharacterslengthrequired1234567890!}
    expiration-ms: 86400000 # 24 hours
  frontend:
    redirect-url: http://localhost:5173/oauth2/callback
  tenant:
    # Default upload limitation per tenant in bytes (e.g. 50MB)
    max-file-size-bytes: 52428800

