version: '3.8'
name: FileSphere-BackEnd
services:

  db:
    image: postgres:15-alpine
    container_name: filesphere_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: filesphere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d filesphere" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filesphere_network

  api:
    build:
      context: ./file-managed-service
      dockerfile: Dockerfile
    container_name: filesphere_api
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=filesphere
      - DB_PORT=5432
      - GIN_MODE=release
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Map the local storage directory to the container's storage path
      # This ensures uploaded files persist on your local machine
      - ./storage:/app/storage
    networks:
      - filesphere_network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: filesphere_auth
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=filesphere
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - filesphere_network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: filesphere_gateway
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=filesphere
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:7002
      - FILE_SERVICE_URL=http://api:7001
    depends_on:
      - api
      - auth-service
    networks:
      - filesphere_network

volumes:
  postgres_data:

networks:
  filesphere_network:
    driver: bridge
